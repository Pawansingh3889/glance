name: glance

services:
  postgres:
    # Fully qualified: Podman defaults to short-name-mode=enforcing, which cannot
    # resolve a bare name without a TTY to prompt on. Docker reads these identically.
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: glance
      POSTGRES_DB: glance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glance -d glance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tier 3 of the LLM chain: the local backstop, reached only when the cloud tiers
  # fail. It is never rate-limited and never out of credit, which is the whole point.
  ollama:
    image: docker.io/ollama/ollama:latest
    environment:
      # Ollama unloads a model after ~5 minutes idle by default, so the first turn
      # after any gap pays a full cold load — on CPU that is minutes, and it is the
      # only reason tier 3's timeout is 300s. Keeping the model resident pays that
      # cost once at startup instead of once per idle gap.
      #
      # This is the server-side lever. Passing `keep_alive` as a request field works
      # on Ollama's native /api/chat but is not reliably honoured by the /v1 OpenAI
      # shim this app speaks, so it is set here where it unambiguously applies.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # Not just "is the server up" — the model must actually be present, or tier 3
      # 404s at precisely the moment both cloud tiers have already failed.
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q \"${OLLAMA_MODEL:-llama3.2:3b}\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 60          # generous: the first pull downloads several GB
      start_period: 30s

  # Pulls the model once, then exits. The backend waits on this completing rather
  # than on the ollama container merely being up.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until ollama list >/dev/null 2>&1; do sleep 2; done;
       ollama pull "${OLLAMA_MODEL:-llama3.2:3b}"'
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://glance:glance@postgres:5432/glance
      # LLM tiers (ordered failover chain). At least one tier must be configured.
      LLM_TIER1_ENABLED: ${LLM_TIER1_ENABLED:-false}
      LLM_TIER1_BASE_URL: ${LLM_TIER1_BASE_URL:-}
      LLM_TIER1_API_KEY: ${LLM_TIER1_API_KEY:-}
      LLM_TIER1_MODEL: ${LLM_TIER1_MODEL:-}
      LLM_TIER1_TIMEOUT_SECONDS: ${LLM_TIER1_TIMEOUT_SECONDS:-300}
      LLM_TIER2_ENABLED: ${LLM_TIER2_ENABLED:-false}
      LLM_TIER2_BASE_URL: ${LLM_TIER2_BASE_URL:-}
      LLM_TIER2_API_KEY: ${LLM_TIER2_API_KEY:-}
      LLM_TIER2_MODEL: ${LLM_TIER2_MODEL:-}
      LLM_TIER2_TIMEOUT_SECONDS: ${LLM_TIER2_TIMEOUT_SECONDS:-300}
      # Tier 3 defaults point at the in-network Ollama service above, so the local
      # backstop works out of the box without anything in .env.
      LLM_TIER3_ENABLED: ${LLM_TIER3_ENABLED:-true}
      LLM_TIER3_BASE_URL: ${LLM_TIER3_BASE_URL:-http://ollama:11434/v1}
      LLM_TIER3_API_KEY: ${LLM_TIER3_API_KEY:-}
      LLM_TIER3_MODEL: ${LLM_TIER3_MODEL:-llama3.2:3b}
      LLM_TIER3_TIMEOUT_SECONDS: ${LLM_TIER3_TIMEOUT_SECONDS:-300}
      DOCUMENTS_STORAGE_PATH: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./backend:/app:z
      - /app/.venv
      # Uploaded/fetched documents. A named volume, not a bind mount, so ownership and
      # SELinux labelling aren't the developer's problem, and it survives `compose down`
      # the same way pgdata does.
      - documents_data:/data/uploads
    command: >-
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      # Read by the browser, not by the container, so it is the host-published
      # address rather than the in-network one. The backend's CORS allow-list is
      # FRONTEND_ORIGIN, which defaults to http://localhost:3000 to match.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:z
      # Anonymous volumes keep the image's install and the dev server's build
      # output inside the container. Without them the bind mount hides
      # node_modules, and .next gets written to the host as root.
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  # Model weights are several GB; a named volume keeps them across `compose down`
  # so the pull happens once rather than on every restart.
  ollama:
  documents_data:
